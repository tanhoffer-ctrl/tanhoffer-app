<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkoutPro - Meus Treinos</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --primary: #f97316;
      --primary-dark: #ea580c;
      --bg: #0f0f0f;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
      --text: #f5f5f5;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    .container { max-width: 900px; margin: 0 auto; padding: 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: #2a2a2a; color: var(--text); }
    .btn-ghost:hover { background: #383838; }
    .btn-danger { background: rgba(220,38,38,0.2); color: #f87171; }
    .btn-danger:hover { background: rgba(220,38,38,0.4); }

    .input {
      width: 100%;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
    }
    .input:focus { outline: none; border-color: var(--primary); }
    .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .row { display: flex; align-items: center; gap: 12px; }
    .wrap { flex-wrap: wrap; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

    .header-bar {
      position: sticky; top: 0; z-index: 30;
      background: rgba(15,15,15,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin-bottom: 20px;
    }
    .stat-box { text-align: center; padding: 16px; }
    .stat-num { font-size: 24px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--muted); }

    .pse-bar { display: flex; gap: 3px; margin-bottom: 6px; }
    .pse-block { flex: 1; height: 10px; border-radius: 2px; cursor: pointer; transition: all 0.15s; }

    .media-thumb {
      position: relative; width: 80px; height: 80px;
      border-radius: 8px; overflow: hidden; background: #222; cursor: pointer;
    }
    .media-thumb img, .media-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .media-del {
      position: absolute; top: 2px; right: 2px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #dc2626; color: #fff; border: none;
      font-size: 14px; line-height: 1;
    }
    .dropzone {
      border: 2px dashed #444; border-radius: 12px;
      padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .dropzone:hover, .dropzone.drag { border-color: var(--primary); background: rgba(249,115,22,0.08); }

    .modal-back {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 20px;
    }
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 60;
      padding: 12px 20px; border-radius: 12px; font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { color: var(--muted); font-size: 11px; text-align: center; padding: 6px; border-bottom: 1px solid var(--border); }
    td { text-align: center; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .clickable { cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>Este aplicativo precisa de JavaScript ativado.</noscript>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useRef, useMemo } = React;

    const MUSCLE_GROUPS = ['Peito','Costas','Ombros','Biceps','Triceps','Antebraco','Abdomen','Gluteos','Quadriceps','Posterior de coxa','Panturrilha','Full Body'];
    const EQUIPMENT = ['Barra','Halter','Maquina','Cabo','Elastico','Peso Corporal','Smith','Kettlebell','TRX','Anilha'];
    const CATEGORIES = ['Hipertrofia','Forca','Resistencia','Emagrecimento','Funcional','Reabilitacao','Potencia'];
    const PSE_LABELS = {
      0:'Sem esforco', 1:'Muito leve', 2:'Leve', 3:'Moderado', 4:'Pouco intenso',
      5:'Intenso', 6:'Bem intenso', 7:'Muito intenso', 8:'Extremamente intenso',
      9:'Quase maximo', 10:'Maximo absoluto'
    };
    const PSE_COLORS = ['#4ade80','#86efac','#a3e635','#bef264','#facc15','#fb923c','#f97316','#ef4444','#dc2626','#b91c1c','#7f1d1d'];
    const WEEK_DAYS = ['Seg','Ter','Qua','Qui','Sex','Sab','Dom'];

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
    const clone = (o) => JSON.parse(JSON.stringify(o));

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    const newSet = () => ({ id: uid(), reps: '', load: '', unit: 'kg', pse: 7, rest: 60 });
    const newExercise = () => ({ id: uid(), name: '', muscleGroup: '', equipment: '', notes: '', sets: [newSet()], media: [] });
    const newWorkout = () => ({ id: uid(), name: '', description: '', weekDays: [], category: '', createdAt: new Date().toISOString(), exercises: [] });

    const AppCtx = createContext(null);

    function AppProvider({ children }) {
      const [workouts, setWorkouts] = useState(() => {
        try { return JSON.parse(localStorage.getItem('workouts') || '[]'); } catch (e) { return []; }
      });
      const [view, setView] = useState('dashboard');
      const [activeId, setActiveId] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => { localStorage.setItem('workouts', JSON.stringify(workouts)); }, [workouts]);

      const showToast = (msg, type) => {
        setToast({ msg, type: type || 'success' });
        setTimeout(() => setToast(null), 2600);
      };
      const saveWorkout = (w) => {
        setWorkouts(prev => prev.find(x => x.id === w.id) ? prev.map(x => x.id === w.id ? w : x) : [...prev, w]);
        showToast('Treino salvo!');
        setView('dashboard');
      };
      const deleteWorkout = (id) => {
        setWorkouts(prev => prev.filter(w => w.id !== id));
        showToast('Treino excluido', 'error');
        setView('dashboard');
      };
      const duplicateWorkout = (id) => {
        const o = workouts.find(w => w.id === id);
        if (!o) return;
        setWorkouts(prev => [...prev, { ...clone(o), id: uid(), name: o.name + ' (copia)', createdAt: new Date().toISOString() }]);
        showToast('Treino duplicado!');
      };
      const openNew = () => { setActiveId(null); setView('form'); };
      const openEdit = (id) => { setActiveId(id); setView('form'); };
      const openDetail = (id) => { setActiveId(id); setView('detail'); };
      const activeWorkout = useMemo(() => workouts.find(w => w.id === activeId) || null, [workouts, activeId]);

      return (
        <AppCtx.Provider value={{ workouts, saveWorkout, deleteWorkout, duplicateWorkout, view, setView, activeWorkout, openNew, openEdit, openDetail, toast }}>
          {children}
        </AppCtx.Provider>
      );
    }

    function Toast({ toast }) {
      if (!toast) return null;
      const err = toast.type === 'error';
      return (
        <div className="toast" style={{ background: err ? '#7f1d1d' : '#ea580c', color: '#fff' }}>
          {toast.msg}
        </div>
      );
    }

    function PSESelector({ value, onChange }) {
      return (
        <div>
          <div className="pse-bar">
            {Array.from({ length: 11 }, (_, i) => (
              <div key={i} className="pse-block" title={PSE_LABELS[i]}
                style={{ background: i <= value ? PSE_COLORS[i] : '#2a2a2a', transform: i === value ? 'scaleY(1.6)' : 'none' }}
                onClick={() => onChange(i)} />
            ))}
          </div>
          <div className="row" style={{ justifyContent: 'space-between' }}>
            <span style={{ fontSize: 12, color: 'var(--muted)' }}>PSE</span>
            <span style={{ fontSize: 12, fontWeight: 600, color: PSE_COLORS[value] }}>{value}/10 - {PSE_LABELS[value]}</span>
          </div>
        </div>
      );
    }

    function MediaUpload({ media, onAdd, onRemove }) {
      const inputRef = useRef();
      const [drag, setDrag] = useState(false);
      const handle = async (files) => {
        for (const f of Array.from(files)) {
          if (!f.type.startsWith('image/') && !f.type.startsWith('video/')) continue;
          const data = await fileToBase64(f);
          onAdd({ id: uid(), type: f.type.startsWith('video/') ? 'video' : 'image', data, name: f.name });
        }
      };
      return (
        <div>
          <div className={'dropzone' + (drag ? ' drag' : '')}
            onClick={() => inputRef.current.click()}
            onDragOver={e => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={e => { e.preventDefault(); setDrag(false); handle(e.dataTransfer.files); }}>
            <div style={{ fontSize: 24 }}>[ + ]</div>
            <div style={{ fontSize: 13, color: 'var(--muted)' }}>Clique ou arraste fotos/videos</div>
            <input ref={inputRef} type="file" accept="image/*,video/*" multiple hidden
              onChange={e => handle(e.target.files)} />
          </div>
          {media.length > 0 && (
            <div className="row wrap" style={{ marginTop: 12, gap: 8 }}>
              {media.map(m => (
                <div key={m.id} className="media-thumb">
                  {m.type === 'video'
                    ? <video src={m.data} muted />
                    : <img src={m.data} alt={m.name} />}
                  <button className="media-del" onClick={e => { e.stopPropagation(); onRemove(m.id); }}>x</button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function MediaModal({ media, startIndex, onClose }) {
      const [idx, setIdx] = useState(startIndex);
      const cur = media[idx];
      if (!cur) return null;
      return (
        <div className="modal-back" onClick={onClose}>
          <div style={{ maxWidth: 700, width: '100%' }} onClick={e => e.stopPropagation()}>
            {cur.type === 'video'
              ? <video src={cur.data} controls autoPlay style={{ width: '100%', borderRadius: 12, maxHeight: '70vh', background: '#000' }} />
              : <img src={cur.data} style={{ width: '100%', borderRadius: 12, maxHeight: '70vh', objectFit: 'contain', background: '#000' }} />}
            <div className="row" style={{ justifyContent: 'space-between', marginTop: 12 }}>
              <button className="btn btn-ghost" onClick={() => setIdx(i => Math.max(0, i - 1))} disabled={idx === 0}>Anterior</button>
              <span style={{ color: 'var(--muted)' }}>{idx + 1} / {media.length}</span>
              <button className="btn btn-ghost" onClick={() => setIdx(i => Math.min(media.length - 1, i + 1))} disabled={idx === media.length - 1}>Proximo</button>
            </div>
            <div style={{ textAlign: 'center', marginTop: 10 }}>
              <button className="btn btn-primary" onClick={onClose}>Fechar</button>
            </div>
          </div>
        </div>
      );
    }

    function SetRow({ set, index, onChange, onDelete, canDelete }) {
      const up = (f, v) => onChange({ ...set, [f]: v });
      return (
        <div className="card" style={{ padding: 12, marginBottom: 8 }}>
          <div className="row wrap" style={{ marginBottom: 10 }}>
            <div style={{ width: 26, height: 26, borderRadius: '50%', background: 'var(--primary)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 12 }}>{index + 1}</div>
            <div style={{ flex: 1 }}>
              <span className="label">Repeticoes</span>
              <input className="input" value={set.reps} placeholder="ex: 12" onChange={e => up('reps', e.target.value)} />
            </div>
            <div style={{ flex: 1 }}>
              <span className="label">Carga</span>
              <div className="row" style={{ gap: 4 }}>
                <input className="input" value={set.load} placeholder="0" onChange={e => up('load', e.target.value)} />
                <select className="input" style={{ width: 70 }} value={set.unit} onChange={e => up('unit', e.target.value)}>
                  <option value="kg">kg</option><option value="lb">lb</option><option value="%">%</option>
                </select>
              </div>
            </div>
            <div style={{ flex: 1 }}>
              <span className="label">Descanso (s)</span>
              <input className="input" type="number" value={set.rest} onChange={e => up('rest', parseInt(e.target.value) || 0)} />
            </div>
            {canDelete && <button className="btn btn-danger" style={{ padding: '8px 10px', alignSelf: 'flex-end' }} onClick={onDelete}>x</button>}
          </div>
          <PSESelector value={set.pse} onChange={v => up('pse', v)} />
        </div>
      );
    }

    function ExerciseCard({ exercise, index, onChange, onDelete }) {
      const [open, setOpen] = useState(true);
      const up = (f, v) => onChange({ ...exercise, [f]: v });
      const updateSet = (id, s) => up('sets', exercise.sets.map(x => x.id === id ? s : x));
      const avg = exercise.sets.length ? (exercise.sets.reduce((a, s) => a + s.pse, 0) / exercise.sets.length).toFixed(1) : '-';
      return (
        <div className="card" style={{ marginBottom: 16, overflow: 'hidden' }}>
          <div className="row clickable" style={{ padding: 16 }} onClick={() => setOpen(!open)}>
            <div style={{ width: 34, height: 34, borderRadius: 10, background: 'rgba(249,115,22,0.2)', color: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700 }}>{index + 1}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600 }}>{exercise.name || 'Exercicio sem nome'}</div>
              <div className="row wrap" style={{ gap: 8, marginTop: 2 }}>
                {exercise.muscleGroup && <span className="badge" style={{ background: 'rgba(59,130,246,0.2)', color: '#93c5fd' }}>{exercise.muscleGroup}</span>}
                <span style={{ fontSize: 12, color: 'var(--muted)' }}>{exercise.sets.length} series</span>
                <span style={{ fontSize: 12, color: 'var(--muted)' }}>PSE ~ {avg}</span>
                {exercise.media.length > 0 && <span style={{ fontSize: 12, color: 'var(--muted)' }}>[{exercise.media.length} midia]</span>}
              </div>
            </div>
            <button className="btn btn-danger" style={{ padding: '6px 10px' }} onClick={e => { e.stopPropagation(); onDelete(); }}>Excluir</button>
            <span style={{ color: 'var(--muted)' }}>{open ? '▲' : '▼'}</span>
          </div>
          {open && (
            <div style={{ padding: 16, borderTop: '1px solid var(--border)' }}>
              <div className="grid2" style={{ marginBottom: 16 }}>
                <div>
                  <span className="label">Nome do exercicio *</span>
                  <input className="input" value={exercise.name} placeholder="ex: Supino Reto com Barra" onChange={e => up('name', e.target.value)} />
                </div>
                <div>
                  <span className="label">Grupo muscular</span>
                  <select className="input" value={exercise.muscleGroup} onChange={e => up('muscleGroup', e.target.value)}>
                    <option value="">Selecionar...</option>
                    {MUSCLE_GROUPS.map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                </div>
                <div>
                  <span className="label">Equipamento</span>
                  <select className="input" value={exercise.equipment} onChange={e => up('equipment', e.target.value)}>
                    <option value="">Selecionar...</option>
                    {EQUIPMENT.map(x => <option key={x} value={x}>{x}</option>)}
                  </select>
                </div>
                <div>
                  <span className="label">Observacoes</span>
                  <input className="input" value={exercise.notes} placeholder="Tecnica, dicas..." onChange={e => up('notes', e.target.value)} />
                </div>
              </div>
              <div style={{ marginBottom: 12 }}>
                <div className="row" style={{ justifyContent: 'space-between', marginBottom: 8 }}>
                  <strong style={{ fontSize: 14 }}>Series e Cargas</strong>
                  <button className="btn btn-primary" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => up('sets', [...exercise.sets, newSet()])}>+ Serie</button>
                </div>
                {exercise.sets.map((s, i) => (
                  <SetRow key={s.id} set={s} index={i} canDelete={exercise.sets.length > 1}
                    onChange={ns => updateSet(s.id, ns)}
                    onDelete={() => up('sets', exercise.sets.filter(x => x.id !== s.id))} />
                ))}
              </div>
              <div>
                <strong style={{ fontSize: 14, display: 'block', marginBottom: 8 }}>Fotos / Videos Demonstrativos</strong>
                <MediaUpload media={exercise.media}
                  onAdd={m => up('media', [...exercise.media, m])}
                  onRemove={id => up('media', exercise.media.filter(x => x.id !== id))} />
              </div>
            </div>
          )}
        </div>
      );
    }

    function WorkoutForm() {
      const { activeWorkout, saveWorkout, setView } = useContext(AppCtx);
      const [w, setW] = useState(() => activeWorkout ? clone(activeWorkout) : newWorkout());
      const [tab, setTab] = useState('info');
      const [errors, setErrors] = useState([]);
      const up = (f, v) => setW(p => ({ ...p, [f]: v }));
      const toggleDay = d => up('weekDays', w.weekDays.includes(d) ? w.weekDays.filter(x => x !== d) : [...w.weekDays, d]);
      const addEx = () => { up('exercises', [...w.exercises, newExercise()]); setTab('ex'); };
      const updEx = (id, ex) => up('exercises', w.exercises.map(e => e.id === id ? ex : e));

      const save = () => {
        const errs = [];
        if (!w.name.trim()) errs.push('Nome do treino e obrigatorio');
        if (w.exercises.length === 0) errs.push('Adicione pelo menos 1 exercicio');
        w.exercises.forEach((e, i) => { if (!e.name.trim()) errs.push('Exercicio ' + (i + 1) + ' sem nome'); });
        setErrors(errs);
        if (errs.length === 0) saveWorkout(w);
        else setTab(errs[0].includes('Nome do treino') ? 'info' : 'ex');
      };

      return (
        <div className="container">
          <div className="header-bar">
            <div className="row">
              <button className="btn btn-ghost" onClick={() => setView('dashboard')}>Voltar</button>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 18 }}>{w.name || (activeWorkout ? 'Editar treino' : 'Novo treino')}</div>
                <div style={{ fontSize: 12, color: 'var(--muted)' }}>{w.exercises.length} exercicios</div>
              </div>
              <button className="btn btn-primary" onClick={save}>Salvar</button>
            </div>
            <div className="row" style={{ marginTop: 12, gap: 16 }}>
              <span className="clickable" style={{ fontWeight: 600, color: tab === 'info' ? 'var(--primary)' : 'var(--muted)' }} onClick={() => setTab('info')}>Informacoes</span>
              <span className="clickable" style={{ fontWeight: 600, color: tab === 'ex' ? 'var(--primary)' : 'var(--muted)' }} onClick={() => setTab('ex')}>Exercicios ({w.exercises.length})</span>
            </div>
          </div>

          {errors.length > 0 && (
            <div className="card" style={{ padding: 12, marginBottom: 16, background: 'rgba(220,38,38,0.15)', borderColor: '#7f1d1d' }}>
              {errors.map((e, i) => <div key={i} style={{ color: '#f87171', fontSize: 13 }}>! {e}</div>)}
            </div>
          )}

          {tab === 'info' && (
            <div>
              <div className="card" style={{ padding: 20, marginBottom: 16 }}>
                <div style={{ marginBottom: 12 }}>
                  <span className="label">Nome do treino *</span>
                  <input className="input" value={w.name} placeholder="ex: Treino A - Peito e Triceps" onChange={e => up('name', e.target.value)} />
                </div>
                <div style={{ marginBottom: 12 }}>
                  <span className="label">Descricao / objetivo</span>
                  <textarea className="input" rows={3} value={w.description} placeholder="Objetivo deste treino..." onChange={e => up('description', e.target.value)} />
                </div>
                <div>
                  <span className="label">Categoria</span>
                  <select className="input" value={w.category} onChange={e => up('category', e.target.value)}>
                    <option value="">Selecionar...</option>
                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>
              <div className="card" style={{ padding: 20 }}>
                <span className="label">Dias da semana</span>
                <div className="row wrap" style={{ gap: 8, marginTop: 6 }}>
                  {WEEK_DAYS.map(d => (
                    <button key={d} className="btn" style={{ background: w.weekDays.includes(d) ? 'var(--primary)' : '#2a2a2a', color: '#fff' }} onClick={() => toggleDay(d)}>{d}</button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {tab === 'ex' && (
            <div>
              {w.exercises.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '60px 0' }}>
                  <div style={{ fontSize: 40, marginBottom: 12 }}>[ ! ]</div>
                  <p style={{ color: 'var(--muted)', marginBottom: 20 }}>Nenhum exercicio adicionado</p>
                  <button className="btn btn-primary" onClick={addEx}>+ Adicionar primeiro exercicio</button>
                </div>
              ) : (
                <div>
                  {w.exercises.map((ex, i) => (
                    <ExerciseCard key={ex.id} exercise={ex} index={i}
                      onChange={n => updEx(ex.id, n)}
                      onDelete={() => up('exercises', w.exercises.filter(x => x.id !== ex.id))} />
                  ))}
                  <button className="btn btn-ghost" style={{ width: '100%', padding: 14 }} onClick={addEx}>+ Adicionar exercicio</button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function WorkoutDetail() {
      const { activeWorkout, openEdit, deleteWorkout, setView } = useContext(AppCtx);
      const [modal, setModal] = useState(null);
      const [openEx, setOpenEx] = useState(null);
      const w = activeWorkout;
      if (!w) return null;
      const totalSets = w.exercises.reduce((a, e) => a + e.sets.length, 0);
      const allPse = w.exercises.flatMap(e => e.sets.map(s => s.pse));
      const avgPse = allPse.length ? (allPse.reduce((a, b) => a + b, 0) / allPse.length).toFixed(1) : '-';
      const loads = w.exercises.flatMap(e => e.sets.map(s => parseFloat(s.load) || 0)).filter(v => v > 0);
      const maxLoad = loads.length ? Math.max(...loads) : null;

      return (
        <div className="container">
          <div className="header-bar">
            <div className="row">
              <button className="btn btn-ghost" onClick={() => setView('dashboard')}>Voltar</button>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 18 }}>{w.name}</div>
                {w.category && <span className="badge" style={{ background: 'rgba(249,115,22,0.2)', color: 'var(--primary)' }}>{w.category}</span>}
              </div>
              <button className="btn btn-ghost" onClick={() => openEdit(w.id)}>Editar</button>
              <button className="btn btn-danger" onClick={() => { if (confirm('Excluir treino?')) deleteWorkout(w.id); }}>Excluir</button>
            </div>
          </div>

          <div className="row wrap" style={{ gap: 12, marginBottom: 20 }}>
            {[['Exercicios', w.exercises.length], ['Series', totalSets], ['PSE medio', avgPse], ['Carga max', maxLoad ? maxLoad + 'kg' : '-']].map(([l, v]) => (
              <div key={l} className="card stat-box" style={{ flex: 1, minWidth: 140 }}>
                <div className="stat-num">{v}</div>
                <div className="stat-label">{l}</div>
              </div>
            ))}
          </div>

          {(w.description || w.weekDays.length > 0) && (
            <div className="card" style={{ padding: 16, marginBottom: 20 }}>
              {w.description && <p style={{ fontSize: 14, color: '#ddd', marginBottom: 10 }}>{w.description}</p>}
              {w.weekDays.length > 0 && (
                <div className="row wrap" style={{ gap: 6 }}>
                  {WEEK_DAYS.map(d => (
                    <span key={d} className="badge" style={{ background: w.weekDays.includes(d) ? 'var(--primary)' : '#2a2a2a', color: w.weekDays.includes(d) ? '#fff' : '#666' }}>{d}</span>
                  ))}
                </div>
              )}
            </div>
          )}

          {w.exercises.map((ex, ei) => (
            <div key={ex.id} className="card" style={{ marginBottom: 16, overflow: 'hidden' }}>
              <div className="row clickable" style={{ padding: 16 }} onClick={() => setOpenEx(openEx === ex.id ? null : ex.id)}>
                <div style={{ width: 34, height: 34, borderRadius: 10, background: 'rgba(249,115,22,0.2)', color: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700 }}>{ei + 1}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 600 }}>{ex.name}</div>
                  <div className="row wrap" style={{ gap: 8, marginTop: 2 }}>
                    {ex.muscleGroup && <span className="badge" style={{ background: 'rgba(59,130,246,0.2)', color: '#93c5fd' }}>{ex.muscleGroup}</span>}
                    {ex.equipment && <span className="badge" style={{ background: 'rgba(168,85,247,0.2)', color: '#d8b4fe' }}>{ex.equipment}</span>}
                    <span style={{ fontSize: 12, color: 'var(--muted)' }}>{ex.sets.length} x {ex.sets[0] ? ex.sets[0].reps || '?' : '?'}</span>
                  </div>
                </div>
                <span style={{ color: 'var(--muted)' }}>{openEx === ex.id ? '▲' : '▼'}</span>
              </div>
              {openEx === ex.id && (
                <div style={{ padding: 16, borderTop: '1px solid var(--border)' }}>
                  {ex.media.length > 0 && (
                    <div className="row wrap" style={{ gap: 8, marginBottom: 16 }}>
                      {ex.media.map((m, mi) => (
                        <div key={m.id} className="media-thumb" onClick={() => setModal({ media: ex.media, i: mi })}>
                          {m.type === 'video' ? <video src={m.data} muted /> : <img src={m.data} />}
                        </div>
                      ))}
                    </div>
                  )}
                  {ex.notes && <p style={{ fontSize: 13, color: '#fbbf24', fontStyle: 'italic', marginBottom: 12 }}>Obs: {ex.notes}</p>}
                  <table>
                    <thead><tr><th>Serie</th><th>Reps</th><th>Carga</th><th>Descanso</th><th>PSE</th></tr></thead>
                    <tbody>
                      {ex.sets.map((s, si) => (
                        <tr key={s.id}>
                          <td>{si + 1}</td>
                          <td style={{ fontWeight: 600 }}>{s.reps || '-'}</td>
                          <td style={{ fontWeight: 600 }}>{s.load ? s.load + s.unit : '-'}</td>
                          <td style={{ color: 'var(--muted)' }}>{s.rest}s</td>
                          <td><span className="badge" style={{ background: PSE_COLORS[s.pse] + '33', color: PSE_COLORS[s.pse] }}>{s.pse}/10</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          ))}

          {modal && <MediaModal media={modal.media} startIndex={modal.i} onClose={() => setModal(null)} />}
        </div>
      );
    }

    function Dashboard() {
      const { workouts, openNew, openDetail, openEdit, deleteWorkout, duplicateWorkout } = useContext(AppCtx);
      const [search, setSearch] = useState('');
      const [sort, setSort] = useState('newest');
      const list = useMemo(() => {
        let l = workouts.filter(w => w.name.toLowerCase().includes(search.toLowerCase()));
        if (sort === 'newest') l = [...l].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        else if (sort === 'name') l = [...l].sort((a, b) => a.name.localeCompare(b.name));
        return l;
      }, [workouts, search, sort]);
      const totalEx = workouts.reduce((a, w) => a + w.exercises.length, 0);

      return (
        <div className="container">
          <div style={{ padding: '30px 0 20px' }}>
            <div className="row" style={{ justifyContent: 'space-between', marginBottom: 20 }}>
              <div>
                <h1 style={{ fontSize: 28 }}>WorkoutPro</h1>
                <p style={{ color: 'var(--muted)', fontSize: 14 }}>Seus treinos de musculacao</p>
              </div>
              <button className="btn btn-primary" onClick={openNew}>+ Novo treino</button>
            </div>
            {workouts.length > 0 && (
              <div className="row" style={{ gap: 12 }}>
                <div className="card stat-box" style={{ flex: 1 }}><div className="stat-num">{workouts.length}</div><div className="stat-label">Treinos</div></div>
                <div className="card stat-box" style={{ flex: 1 }}><div className="stat-num">{totalEx}</div><div className="stat-label">Exercicios</div></div>
              </div>
            )}
          </div>

          {workouts.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '80px 0' }}>
              <div style={{ fontSize: 50, marginBottom: 16 }}>[ ! ]</div>
              <h2 style={{ marginBottom: 8 }}>Nenhum treino ainda</h2>
              <p style={{ color: 'var(--muted)', marginBottom: 24 }}>Crie seu primeiro treino com exercicios, series, cargas e PSE</p>
              <button className="btn btn-primary" onClick={openNew}>+ Criar primeiro treino</button>
            </div>
          ) : (
            <div>
              <div className="row wrap" style={{ gap: 8, marginBottom: 20 }}>
                <input className="input" style={{ flex: 1, minWidth: 160 }} placeholder="Buscar treino..." value={search} onChange={e => setSearch(e.target.value)} />
                <select className="input" style={{ width: 160 }} value={sort} onChange={e => setSort(e.target.value)}>
                  <option value="newest">Mais recentes</option>
                  <option value="name">Nome (A-Z)</option>
                </select>
              </div>
              <div className="grid2">
                {list.map(w => {
                  const sets = w.exercises.reduce((a, e) => a + e.sets.length, 0);
                  const media = w.exercises.reduce((a, e) => a + e.media.length, 0);
                  return (
                    <div key={w.id} className="card" style={{ overflow: 'hidden' }}>
                      <div className="clickable" style={{ padding: 16 }} onClick={() => openDetail(w.id)}>
                        <div className="row" style={{ justifyContent: 'space-between', marginBottom: 8 }}>
                          <strong style={{ fontSize: 16 }}>{w.name}</strong>
                          {w.category && <span className="badge" style={{ background: 'rgba(249,115,22,0.2)', color: 'var(--primary)' }}>{w.category}</span>}
                        </div>
                        {w.description && <p style={{ fontSize: 13, color: 'var(--muted)', marginBottom: 10 }}>{w.description}</p>}
                        {w.weekDays.length > 0 && (
                          <div className="row wrap" style={{ gap: 4, marginBottom: 10 }}>
                            {w.weekDays.map(d => <span key={d} className="badge" style={{ background: 'var(--primary)', color: '#fff' }}>{d}</span>)}
                          </div>
                        )}
                        <div className="row wrap" style={{ gap: 12, fontSize: 12, color: 'var(--muted)' }}>
                          <span>{w.exercises.length} exercicios</span>
                          <span>{sets} series</span>
                          {media > 0 && <span>{media} midias</span>}
                        </div>
                      </div>
                      <div className="row" style={{ padding: 12, borderTop: '1px solid var(--border)', justifyContent: 'flex-end', gap: 8 }}>
                        <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => openEdit(w.id)}>Editar</button>
                        <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => duplicateWorkout(w.id)}>Duplicar</button>
                        <button className="btn btn-danger" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => { if (confirm('Excluir "' + w.name + '"?')) deleteWorkout(w.id); }}>Excluir</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const { view, toast } = useContext(AppCtx);
      return (
        <div>
          {view === 'dashboard' && <Dashboard />}
          {view === 'form' && <WorkoutForm />}
          {view === 'detail' && <WorkoutDetail />}
          <Toast toast={toast} />
        </div>
      );
    }

    try {
      if (!window.React || !window.ReactDOM) throw new Error('Bibliotecas React nao carregaram. Verifique sua conexao com a internet.');
      ReactDOM.createRoot(document.getElementById('root')).render(
        <AppProvider><App /></AppProvider>
      );
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;max-width:500px;margin:60px auto">' +
        '<h2 style="color:#f97316">Erro ao carregar o app</h2>' +
        '<p style="color:#aaa">' + err.message + '</p></div>';
      console.error(err);
    }
  </script>
</body>
</html>
